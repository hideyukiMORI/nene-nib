<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NeNe Nib — 起動画面（案・D70・ADR 0172）</title>
<style>
/* Design reference only (static). Tokens mirror core::Palette. ?scene=light for the light theme, ?scene=empty for 履歴もブックマークも無い起動. */
:root{color-scheme:dark;--background:#300a24;--text:#eeeeec;--muted:#b8a9b3;--gutter:#7a6675;--current_line:#3e1a32;--title_bar:#1e0516;--status:#26071d;--accent:#e95420;--on_accent:#ffffff;--panel:#3b1430;--panel_border:#5a2a4c}
:root.light{color-scheme:light;--background:#f4f5f7;--text:#1b1f24;--muted:#5c6570;--gutter:#9aa3ad;--current_line:#e6e8ec;--title_bar:#e1e4e9;--status:#e9ebef;--accent:#e95420;--on_accent:#ffffff;--panel:#ffffff;--panel_border:#d5d9e0}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:'Segoe UI Variable Text','Segoe UI','Yu Gothic UI',sans-serif;font-size:13px;color:var(--text);background:var(--background)}
.app{width:100%;height:100%;display:grid;grid-template-rows:40px 1fr 28px}
.caption{display:flex;align-items:end;gap:2px;padding-left:8px;background:var(--title_bar)}
.tab{display:flex;gap:10px;align-items:center;padding:0 14px;height:32px;background:var(--background);border-radius:6px 6px 0 0;font-size:12px}
.document{position:relative;display:grid;justify-content:center;align-content:start;padding-top:48px;font-family:'Cascadia Code','Yu Gothic UI',monospace;font-size:15px;line-height:26px}
.column{width:480px;max-width:calc(100% - 32px)}
.gutter{position:absolute;left:16px;top:12px;color:var(--gutter);font-size:15px;line-height:26px}
.brand{color:var(--muted);font-size:22px;line-height:34px;margin-bottom:22px;font-family:'Segoe UI Variable Display','Segoe UI','Yu Gothic UI',sans-serif}
.section{color:var(--muted);font-size:12px;letter-spacing:.06em;margin:16px 0 4px;font-family:'Segoe UI Variable Text','Segoe UI',sans-serif}
.row{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;padding:0 6px;border-radius:4px;white-space:nowrap;overflow:hidden}
.row.selected{background:var(--current_line)}.row .mark{color:var(--muted)}.row .path{overflow:hidden;text-overflow:ellipsis}
.row .side{color:var(--muted);font-size:12px;font-family:'Segoe UI Variable Text','Segoe UI',sans-serif}
.key{display:inline-block;min-width:22px;padding:0 6px;margin:0 1px;border:1px solid var(--panel_border);border-radius:4px;background:var(--panel);font-size:11px;line-height:18px;color:var(--text);text-align:center;font-family:'Segoe UI Variable Text','Segoe UI',sans-serif}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px}
.keys .row{grid-template-columns:auto 1fr}
.status{display:flex;gap:18px;align-items:center;padding:0 12px;background:var(--status);font-size:12px;color:var(--muted)}
.empty-note{color:var(--muted);font-size:12px;font-family:'Segoe UI Variable Text','Segoe UI',sans-serif}
</style>
</head>
<body>
<main class="app" id="app" aria-label="起動画面の静的な設計案"></main>
<script>
// 静的な見た目の案。何も書いていない無題の文書の本文の面に描かれる（ADR 0172 の決定 1・5）。
const scene = new URLSearchParams(location.search).get('scene') || 'dark';
document.documentElement.classList.toggle('light', scene === 'light');
const empty = scene === 'empty';
const recent = empty ? [] : ['D:\\NeNeNib\\docs\\reports\\2026-10-27.md', 'C:\\Users\\info\\WORKS\\NeNeNib\\CLAUDE.md', 'D:\\NeNeNib\\briefs\\20261028\\_common.md', 'C:\\Users\\info\\WORKS\\NeNeNib\\docs\\plans\\2026-10-21-large-file.md'];
const bookmarks = empty ? [] : ['C:\\Users\\info\\WORKS\\NeNeNib\\SPECIFICATION.md', 'D:\\NeNeNib\\evidence\\20261027-trial\\README.md'];
const k = s => `<span class="key">${s}</span>`;
const row = (text, side, selected) => `<div class="row ${selected?'selected':''}"><span class="mark">${selected?'▸':''}</span><span class="path">${text}</span><span class="side">${side||''}</span></div>`;
const section = (title, body) => body ? `<div class="section">${title}</div>${body}` : '';
document.getElementById('app').innerHTML = `
 <div class="caption"><div class="tab"><span>無題</span><span>×</span></div></div>
 <div class="document">
  <div class="gutter">1</div>
  <div class="column">
   <div class="brand">NeNe Nib</div>
   ${section('最近使ったファイル', recent.map((p,i)=>row(p,'',i===0)).join(''))}
   ${section('ブックマーク', bookmarks.map(p=>row(p,'')).join(''))}
   ${empty ? `<div class="empty-note">まだ履歴がありません。ファイルを開くか、そのまま打ち始めてください。</div>` : ''}
   ${section('はじめる', row('新しいファイル','そのまま打ち始める', empty) + row('ファイルを開く', k('Ctrl')+'+'+k('O')) + row('フォルダを開く','ルートを選んでエクスプローラーを出す'))}
   <div class="section">鍵</div>
   <div class="keys">
    <div class="row"><span>${k('Ctrl')}+${k('P')}</span><span class="side">何でも探す</span></div>
    <div class="row"><span>${k('F1')}</span><span class="side">操作の一覧</span></div>
    <div class="row"><span>${k('Ctrl')}+${k('Shift')}+${k('E')}</span><span class="side">エクスプローラー</span></div>
    <div class="row"><span>${k('Ctrl')}+${k(',')}</span><span class="side">設定</span></div>
   </div>
  </div>
 </div>
 <div class="status"><span>通常</span><span>Vim</span><span style="margin-left:auto">行 1, 桁 1</span><span>UTF-8</span><span>LF</span><span>text</span></div>`;
</script>
</body>
</html>

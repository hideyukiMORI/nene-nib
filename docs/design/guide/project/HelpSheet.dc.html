<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ヘルプ 2 早見表の 1 枚</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+JP:wght@400;600;700&display=swap">
<style>
body{margin:0}
a{color:#E95420}a:hover{color:#C7431A}
</style>
</helmet>
<div style="position: relative; width: 960px; height: 560px; overflow: hidden; background: #300A24; color: #EEEEEC; font-family: 'Segoe UI Variable Text', 'Segoe UI', 'Noto Sans JP', system-ui, sans-serif">
  <div style="display: flex; align-items: flex-end; height: 40px; padding-left: 8px; background: #1E0516">
    <div style="display: flex; align-items: center; gap: 8px; height: 32px; box-sizing: border-box; padding: 0 10px 0 14px; min-width: 140px; border-radius: 6px 6px 0 0; background: #300A24; border-bottom: 2px solid #E95420; font-size: 12.5px">
      <span style="flex: 1 1 auto">買い物メモ.txt</span>
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#EEEEEC" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"></path></svg>
    </div>
    <span style="flex: 1 1 auto"></span>
    <div style="display: flex; align-self: stretch; color: #B8A9B3">
      <div style="display: flex; width: 46px; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M0.5 5h9"></path></svg></div>
      <div style="display: flex; width: 46px; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9"></rect></svg></div>
      <div style="display: flex; width: 46px; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.1" aria-hidden="true"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9"></path></svg></div>
    </div>
  </div>
  <div style="position: absolute; top: 40px; bottom: 28px; left: 0; right: 0; padding-top: 12px; font-family: 'JetBrains Mono', 'Cascadia Code', 'Noto Sans JP', Consolas, monospace; font-size: 13.5px; line-height: 24px">
    <div style="display: flex; height: 24px; background: #3E1A32">
      <div style="width: 56px; flex: 0 0 56px; box-sizing: border-box; padding-right: 16px; text-align: right; font-size: 12px; color: #EEEEEC">1</div>
      <div>買い物メモ</div>
    </div>
  </div>
  <div style="position: absolute; left: 120px; top: 76px; width: 720px; box-sizing: border-box; border: 1px solid #5A2A4C; border-radius: 10px; background: #3B1430; overflow: hidden">
    <div style="display: flex; align-items: center; height: 48px; padding: 0 24px; border-bottom: 1px solid #5A2A4C; font-size: 14px; font-weight: 700">操作の早見表</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 40px; row-gap: 22px; padding: 20px 24px 22px">
      <div style="display: flex; flex-direction: column; gap: 9px">
        <div style="font-size: 11.5px; font-weight: 700; color: #F0A47A">ファイル</div>
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px"><span>ファイルとタブの一覧</span><span style="font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; font-size: 12px; color: #D9CFD5">Ctrl+P</span></div>
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px"><span>ファイルを開く</span><span style="font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; font-size: 12px; color: #D9CFD5">Ctrl+O</span></div>
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px"><span>保存</span><span style="font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; font-size: 12px; color: #D9CFD5">Ctrl+S</span></div>
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px"><span>名前を付けて保存</span><span style="font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; font-size: 12px; color: #D9CFD5">Ctrl+Shift+S</span></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 9px">
        <div style="font-size: 11.5px; font-weight: 700; color: #F0A47A">タブ</div>
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px"><span>新しいタブ</span><span style="font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; font-size: 12px; color: #D9CFD5">Ctrl+T</span></div>
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px"><span>タブを閉じる</span><span style="font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; font-size: 12px; color: #D9CFD5">Ctrl+W</span></div>
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px"><span>前に使ったタブへ</span><span style="font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; font-size: 12px; color: #D9CFD5">Ctrl+Tab</span></div>
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px"><span>ブックマークに付ける・外す</span><span style="font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; font-size: 12px; color: #D9CFD5">Ctrl+D</span></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 9px">
        <div style="font-size: 11.5px; font-weight: 700; color: #F0A47A">編集</div>
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px"><span>元に戻す</span><span style="font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; font-size: 12px; color: #D9CFD5">Ctrl+Z</span></div>
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px"><span>やり直す</span><span style="font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; font-size: 12px; color: #D9CFD5">Ctrl+Y</span></div>
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px"><span>コピー・切り取り・貼り付け</span><span style="font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; font-size: 12px; color: #D9CFD5">Ctrl+C / X / V</span></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 9px">
        <div style="font-size: 11.5px; font-weight: 700; color: #F0A47A">表示</div>
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px"><span>文字を大きく・小さく</span><span style="font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; font-size: 12px; color: #D9CFD5">Ctrl++ / Ctrl+-</span></div>
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px"><span>文字の大きさを戻す</span><span style="font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; font-size: 12px; color: #D9CFD5">Ctrl+0</span></div>
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px"><span>この早見表</span><span style="font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; font-size: 12px; color: #D9CFD5">F1</span></div>
      </div>
    </div>
    <div style="display: flex; align-items: center; height: 36px; padding: 0 24px; border-top: 1px solid #5A2A4C; font-size: 11.5px; color: #B8A9B3">Esc 閉じる</div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 16px; height: 28px; box-sizing: border-box; padding: 0 12px; background: #26071D; font-size: 12px; color: #B8A9B3">
    <div style="display: flex; align-items: center; gap: 2px; padding: 2px; border-radius: 6px; background: #4A1E3D">
      <span style="padding: 1px 10px; border-radius: 4px; font-weight: 600; background: #E95420; color: #FFFFFF">通常</span>
      <span style="padding: 1px 10px; border-radius: 4px; font-weight: 600; color: #B8A9B3">Vim</span>
    </div>
    <span style="font-weight: 700; color: #EEEEEC">通常</span>
    <span style="flex: 1 1 auto"></span>
    <span>行 1, 桁 1</span>
    <span>UTF-8</span>
    <span>CRLF</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":560}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>

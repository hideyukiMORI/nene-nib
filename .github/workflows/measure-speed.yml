name: Measure palette speed

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      bench:
        description: Benchmark to measure on this host
        required: true
        type: choice
        options:
          - key-to-frame-palette-5000
        default: key-to-frame-palette-5000

permissions:
  contents: read

jobs:
  measure-palette-speed:
    if: >-
      (github.event_name == 'pull_request' && github.event.label.name == 'measure-palette-speed') ||
      (github.event_name == 'workflow_dispatch' && inputs.bench == 'key-to-frame-palette-5000')
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Read pinned Python version
        id: versions
        shell: pwsh
        run: |
          $version = (Get-Content eng/tool-versions.json -Raw | ConvertFrom-Json).python
          "python=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ steps.versions.outputs.python }}
      - name: Build canonical Release
        id: release
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./eng/build-release.ps1 -Ref HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $short = (& git rev-parse --short=7 HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $record = Get-Content -LiteralPath "out/release/$short.json" -Raw | ConvertFrom-Json
          "executable=$($record.executable)" >> $env:GITHUB_OUTPUT
      # ADR 0016 / 0021: 明示した対象だけ測る。3 run は同じ host の揺れを見る独立した記録で、
      # 失敗を再試行して通すものではない。基準値の採用・commit は CI では行わない。
      - name: Measure three independent runs on this host
        shell: pwsh
        env:
          SPEED_EXECUTABLE: ${{ steps.release.outputs.executable }}
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          foreach ($measurementRun in 1..3) {
            Write-Host "Palette speed: run $measurementRun of 3"
            python eng/measure-speed.py --check --bench key-to-frame-palette-5000 --executable $env:SPEED_EXECUTABLE
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload speed and Release records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: palette-speed-records
          path: |
            out/speed/*.json
            out/speed/palette-*.png
            out/release/*.json
          retention-days: 90

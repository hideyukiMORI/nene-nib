name: Check
run-name: 'Merge PR #${{ inputs.pr_number }} at ${{ inputs.expected_head }}'

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request being merged
        required: true
        type: string
      expected_head:
        description: Exact reviewed head SHA
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: merge-check-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_head }}
      - name: Read pinned Python version
        id: versions
        shell: pwsh
        run: |
          $version = (Get-Content eng/tool-versions.json -Raw | ConvertFrom-Json).python
          "python=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ steps.versions.outputs.python }}
      # #568: 規約の検査より先に conformance の自己テストを回し、契約の遅れ（#554）を merge 前に止める。
      - name: Conformance self-tests
        shell: pwsh
        run: |
          python eng/test-conformance.py
          exit $LASTEXITCODE
      # #648: 木そのものの検査（CNF-001〜012・build dir 無しの字句と名前）。自己テストだけでは木の違反を止めない。
      # 違反の文言は日本語を含み得る。windows-2022 の stdout は cp1252 なので UTF-8 に固定する（#94）。
      - name: Conformance (tree)
        env:
          PYTHONUTF8: '1'
        shell: pwsh
        run: |
          python eng/conformance.py
          exit $LASTEXITCODE
      # 実装の検証結果は PR に記録し、入力が不変なら再利用する（ADR 0021）。
      # 正典の merge-pr.py が非文書変更のマージ直前だけ起動する（ADR 0118）。
      - name: Git conventions and verification record
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_PR: ${{ inputs.pr_number }}
          MERGE_HEAD: ${{ inputs.expected_head }}
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./eng/validate-git.ps1 -PullRequest $env:MERGE_PR -ExpectedHead $env:MERGE_HEAD
          exit $LASTEXITCODE
  # ADR 0136: PR の最終 HEAD が製品としてビルドでき、単体テストが通ることの機械の裏付け。
  # 構成は Release 1 つ（実機のゲートの Release の段と同じ命令）。Debug と速さは実機のまま。
  # 道具は速さの計測の workflow の Release の段と同じく toolchain.ps1 が整えて版を照合する。
  # env は step ごとに切れるので、各 step で toolchain.ps1 を読み直す。
  build-and-test:
    name: build-and-test
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_head }}
      - name: Read pinned Python version
        id: versions
        shell: pwsh
        run: |
          $version = (Get-Content eng/tool-versions.json -Raw | ConvertFrom-Json).python
          "python=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ steps.versions.outputs.python }}
      # #1057: 整形の検査（QLT-004）は eng/format-check.ps1 の 1 本で、手元の全件ゲートと同じものを呼ぶ。
      # clang-format 19.1.5 は clang-cl と同じ VS の LLVM から来て、版は toolchain.ps1 が照合する（ADR 0136 の決定 8）。
      - name: Formatting (QLT-004)
        shell: pwsh
        run: |
          . ./eng/toolchain.ps1
          pwsh -NoProfile -File ./eng/format-check.ps1
          exit $LASTEXITCODE
      - name: Configure Release
        shell: pwsh
        run: |
          . ./eng/toolchain.ps1
          # eng/symbols.py reads the static libraries from the CMake File API reply (ADR 0136 addendum, #1024).
          New-Item -ItemType Directory -Force -Path build-release/.cmake/api/v1/query | Out-Null
          New-Item -ItemType File -Force -Path build-release/.cmake/api/v1/query/codemodel-v2 | Out-Null
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release
          exit $LASTEXITCODE
      - name: Build all Release targets
        shell: pwsh
        run: |
          . ./eng/toolchain.ps1
          cmake --build build-release
          exit $LASTEXITCODE
      - name: Linker symbols (ARC-003 / ARC-007 / CPP-013)
        shell: pwsh
        run: |
          . ./eng/toolchain.ps1
          python eng/symbols.py --build-dir build-release --require core application
          exit $LASTEXITCODE
      - name: Run unit tests
        shell: pwsh
        run: |
          . ./eng/toolchain.ps1
          ctest --test-dir build-release --output-on-failure --no-tests=error
          exit $LASTEXITCODE
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-and-test-log
          path: build-release/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 30

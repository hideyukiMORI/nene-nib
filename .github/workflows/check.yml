name: Check
run-name: 'Merge PR #${{ inputs.pr_number }} at ${{ inputs.expected_head }}'

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request being merged
        required: true
        type: string
      expected_head:
        description: Exact reviewed head SHA
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: merge-check-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_head }}
      - name: Read pinned Python version
        id: versions
        shell: pwsh
        run: |
          $version = (Get-Content eng/tool-versions.json -Raw | ConvertFrom-Json).python
          "python=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ steps.versions.outputs.python }}
      # 実装の検証結果は PR に記録し、入力が不変なら再利用する（ADR 0021）。
      # 正典の merge-pr.py が非文書変更のマージ直前だけ起動する（ADR 0118）。
      - name: Git conventions and verification record
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_PR: ${{ inputs.pr_number }}
          MERGE_HEAD: ${{ inputs.expected_head }}
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./eng/validate-git.ps1 -PullRequest $env:MERGE_PR -ExpectedHead $env:MERGE_HEAD
          exit $LASTEXITCODE

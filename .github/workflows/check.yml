name: Check

on:
  pull_request:
    types: [ready_for_review, synchronize, edited, reopened]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    if: github.event.pull_request.draft == false
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Read pinned Python version
        id: versions
        shell: pwsh
        run: |
          $version = (Get-Content eng/tool-versions.json -Raw | ConvertFrom-Json).python
          "python=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ steps.versions.outputs.python }}
      # 実装の検証結果は PR に記録し、入力が不変なら再利用する（ADR 0021）。
      # イベントで変わる Git / PR メタデータだけを検査し、製品テストを再実行しない。
      - name: Git conventions and verification record
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./eng/validate-git.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          git diff --check "$($event.pull_request.base.sha)...HEAD"
          exit $LASTEXITCODE

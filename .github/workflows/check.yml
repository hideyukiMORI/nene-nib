name: Check
run-name: 'Merge PR #${{ inputs.pr_number }} at ${{ inputs.expected_head }}'

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request being merged
        required: true
        type: string
      expected_head:
        description: Exact reviewed head SHA
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: merge-check-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_head }}
      - name: Read pinned Python version
        id: versions
        shell: pwsh
        run: |
          $version = (Get-Content eng/tool-versions.json -Raw | ConvertFrom-Json).python
          "python=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ steps.versions.outputs.python }}
      # 実装の検証結果は PR に記録し、入力が不変なら再利用する（ADR 0021）。
      # 正典の merge-pr.py が非文書変更のマージ直前だけ起動する（ADR 0118）。
      - name: Git conventions and verification record
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_PR: ${{ inputs.pr_number }}
          MERGE_HEAD: ${{ inputs.expected_head }}
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./eng/validate-git.ps1 -PullRequest $env:MERGE_PR -ExpectedHead $env:MERGE_HEAD
          exit $LASTEXITCODE
  # ADR 0136: PR の最終 HEAD が製品としてビルドでき、単体テストが通ることの機械の裏付け。
  # 構成は Release 1 つ（check.ps1 の Release の段と同じ命令）。Debug と速さは実機のまま。
  # 道具は measure-speed.yml の build-release.ps1 と同じく toolchain.ps1 が整えて版を照合する。
  # env は step ごとに切れるので、各 step で toolchain.ps1 を読み直す。
  build-and-test:
    name: build-and-test
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_head }}
      - name: Read pinned Python version
        id: versions
        shell: pwsh
        run: |
          $version = (Get-Content eng/tool-versions.json -Raw | ConvertFrom-Json).python
          "python=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ steps.versions.outputs.python }}
      - name: Configure Release
        shell: pwsh
        run: |
          . ./eng/toolchain.ps1
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release
          exit $LASTEXITCODE
      - name: Build all Release targets
        shell: pwsh
        run: |
          . ./eng/toolchain.ps1
          cmake --build build-release
          exit $LASTEXITCODE
      - name: Run unit tests
        shell: pwsh
        run: |
          . ./eng/toolchain.ps1
          ctest --test-dir build-release --output-on-failure --no-tests=error
          exit $LASTEXITCODE
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-and-test-log
          path: build-release/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 30

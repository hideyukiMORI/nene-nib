name: Check

on:
  pull_request:
    types: [ready_for_review, synchronize, edited, reopened]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    if: github.event.pull_request.draft == false
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Read pinned Python version
        id: versions
        shell: pwsh
        run: |
          $version = (Get-Content eng/tool-versions.json -Raw | ConvertFrom-Json).python
          "python=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ steps.versions.outputs.python }}
      - name: Full gate
        shell: pwsh
        run: pwsh -NoProfile -File ./eng/check.ps1
